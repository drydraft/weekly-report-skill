<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">先确认，再写盘 — 三道门执行流水线</title>
  <desc id="wf-desc">01 收集与润色，02 预览与确认锁，03 校验与原生落盘。</desc>

  <!-- Warm Paper Canvas (#F7F6F2) -->
  <rect width="1200" height="270" rx="22" fill="#F7F6F2"/>
  <rect x="1" y="1" width="1198" height="268" rx="21" fill="none" stroke="#E5E1D8" stroke-width="1.5"/>

  <!-- Header -->
  <text x="64" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#6B707B" letter-spacing="1.6">THREE-GATE WORKFLOW</text>
  <text x="64" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="800" fill="#181A1F">先确认，再写盘</text>
  <text x="1136" y="84" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#6B707B">大模型负责内容 · Python 脚本负责写盘</text>

  <!-- Smooth Dashed Connecting Track -->
  <line x1="210" y1="158" x2="990" y2="158" stroke="#D5D0C5" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Step 01 -->
  <g id="step-1" transform="translate(64, 126)">
    <rect width="320" height="106" rx="14" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1.2"/>
    <circle cx="42" cy="53" r="22" fill="#181A1F"/>
    <text x="42" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#FFFFFF">01</text>
    <text x="80" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#181A1F">收集与润色</text>
    <text x="80" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#6B707B">口述或顺延 · 补齐协作人</text>
  </g>

  <!-- Step 02 (Focal Warm Coral Accent) -->
  <g id="step-2" transform="translate(440, 126)">
    <rect width="320" height="106" rx="14" fill="#FFFFFF" stroke="#E06D44" stroke-width="1.8"/>
    <circle cx="42" cy="53" r="22" fill="#E06D44"/>
    <text x="42" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#FFFFFF">02</text>
    <text x="80" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#181A1F">预览与确认锁</text>
    <text x="80" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="600" fill="#C95830">未获「确认」绝不生成</text>
  </g>

  <!-- Step 03 (Emerald Finish) -->
  <g id="step-3" transform="translate(816, 126)">
    <rect width="320" height="106" rx="14" fill="#FFFFFF" stroke="#1B6B4A" stroke-width="1.5"/>
    <circle cx="42" cy="53" r="22" fill="#1B6B4A"/>
    <text x="42" y="60" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#FFFFFF">03</text>
    <text x="80" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#181A1F">校验与落盘</text>
    <text x="80" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#1B6B4A">过静态校验写入 .xlsx</text>
  </g>
</svg>
