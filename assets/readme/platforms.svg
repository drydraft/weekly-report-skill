<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="296" viewBox="0 0 1200 296" role="img" aria-labelledby="plat-title plat-desc">
  <title id="plat-title">一份内核，五平台原生挂载</title>
  <desc id="plat-desc">单一 SKILL.md、脚本与模板内核通过轻量外置清单适配 Pi、Codex、DeepSeek Harness、Antigravity 与 Claude Code。</desc>

  <!-- Warm Paper Canvas (#F7F6F2) -->
  <rect width="1200" height="296" rx="22" fill="#F7F6F2"/>
  <rect x="1" y="1" width="1198" height="294" rx="21" fill="none" stroke="#E5E1D8" stroke-width="1.5"/>

  <!-- Header -->
  <text x="64" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#6B707B" letter-spacing="1.6">SINGLE SOURCE · MULTI-RUNTIME</text>
  <text x="64" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="800" fill="#181A1F">一份内核，五平台原生挂载</text>

  <!-- Right Core Pill -->
  <g transform="translate(566, 46)">
    <rect width="570" height="48" rx="10" fill="#181A1F"/>
    <circle cx="24" cy="24" r="5" fill="#1B6B4A"/>
    <text x="42" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#F7F6F2">SKILL.md · scripts/*.py · templates/*.xlsx</text>
  </g>

  <!-- Clean Thin Divider -->
  <line x1="64" y1="120" x2="1136" y2="120" stroke="#E2DDD4" stroke-width="1.2"/>

  <!-- 5 Airy Platform Cards (w=198, gap=20 -> 5*198 + 4*20 = 1070, x=65..1135) -->
  <g transform="translate(65, 146)">
    <!-- Pi -->
    <g transform="translate(0, 0)">
      <rect width="198" height="106" rx="12" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1.2"/>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#181A1F">Pi Agent</text>
      <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1B6B4A">SKILL.md</text>
    </g>

    <!-- Codex -->
    <g transform="translate(218, 0)">
      <rect width="198" height="106" rx="12" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1.2"/>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#181A1F">Codex</text>
      <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1B6B4A">openai.yaml</text>
    </g>

    <!-- DSH -->
    <g transform="translate(436, 0)">
      <rect width="198" height="106" rx="12" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1.2"/>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#181A1F">DSH</text>
      <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1B6B4A">Cordis bundle</text>
    </g>

    <!-- Antigravity -->
    <g transform="translate(654, 0)">
      <rect width="198" height="106" rx="12" fill="#FFFFFF" stroke="#1B6B4A" stroke-width="1.6"/>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#181A1F">Antigravity</text>
      <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1B6B4A">plugin.json</text>
    </g>

    <!-- Claude Code -->
    <g transform="translate(872, 0)">
      <rect width="198" height="106" rx="12" fill="#FFFFFF" stroke="#E4E0D8" stroke-width="1.2"/>
      <text x="20" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#181A1F">Claude Code</text>
      <text x="20" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#1B6B4A">.claude-plugin</text>
    </g>
  </g>
</svg>
