<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">周报助手 (Weekly Report Assistant)</title>
  <desc id="desc">对 AI 讲几句工作碎碎念，自动完成职场化润色，并安全写入企业标准 Excel 周报模板。</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="excel-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#0B5C30"/>
    </linearGradient>
    <linearGradient id="glow-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#107C41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="20" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="20" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Content Area -->
  <g transform="translate(64, 48)">
    <!-- Scope Tag -->
    <rect x="0" y="0" width="260" height="26" rx="6" fill="#1E293B"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" letter-spacing="0.5">AGENT SKILL · PI / OPENCODE / CLAUDE</text>

    <!-- Main Title -->
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">周报助手 · Weekly Report</text>

    <!-- Subtitle -->
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      对 AI 讲几句大白话碎碎念，自动完成<tspan fill="#38BDF8" font-weight="600">职场化提炼</tspan>，
    </text>
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
      零损保真填充至<tspan fill="#22C55E" font-weight="600">企业级 Excel 标准模板</tspan>（保留全部公式与样式）。
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 175)">
      <!-- Pill 1: 智能职场化润色 -->
      <rect x="0" y="0" width="138" height="32" rx="16" fill="#131B2A" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#38BDF8"/>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">智能职场润色</text>

      <!-- Pill 2: 模板原格式保留 -->
      <rect x="148" y="0" width="148" height="32" rx="16" fill="#131B2A" stroke="#334155" stroke-width="1"/>
      <circle cx="164" cy="16" r="4" fill="#22C55E"/>
      <text x="176" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">100% 格式公式保真</text>

      <!-- Pill 3: 跨周自动顺延 -->
      <rect x="306" y="0" width="138" height="32" rx="16" fill="#131B2A" stroke="#334155" stroke-width="1"/>
      <circle cx="322" cy="16" r="4" fill="#F59E0B"/>
      <text x="334" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">跨周智能顺延</text>

      <!-- Pill 4: 自带开箱模板 -->
      <rect x="454" y="0" width="124" height="32" rx="16" fill="#131B2A" stroke="#334155" stroke-width="1"/>
      <circle cx="470" cy="16" r="4" fill="#A855F7"/>
      <text x="482" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#E2E8F0">开箱自带模板</text>
    </g>

    <!-- Bottom Command Cue -->
    <g transform="translate(0, 236)">
      <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#64748B">
        唤醒命令：<tspan fill="#F1F5F9">"写周报"</tspan> · <tspan fill="#F1F5F9">"更新周报"</tspan> · <tspan fill="#F1F5F9">"weekly report"</tspan>
      </text>
    </g>
  </g>

  <!-- Right Visual Specimen (Excel Card Mock) -->
  <g transform="translate(680, 36)">
    <!-- Container Card -->
    <rect width="460" height="288" rx="12" fill="#131B2A" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Excel Window Header -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 448 0 C 454.63 0 460 5.37 460 12 L 460 38 L 0 38 Z" fill="#1E293B"/>
    <circle cx="20" cy="19" r="5" fill="#EF4444"/>
    <circle cx="36" cy="19" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="19" r="5" fill="#10B981"/>
    
    <!-- File Badge -->
    <rect x="74" y="9" width="20" height="20" rx="3" fill="#107C41"/>
    <text x="79" y="24" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">X</text>
    <text x="102" y="23" font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0" font-weight="500">企业工作周报 - 张三.xlsx</text>

    <!-- Mock Excel Sheet Table -->
    <g transform="translate(16, 52)">
      <!-- Sheet Banner Row -->
      <rect x="0" y="0" width="428" height="26" fill="url(#excel-grad)" rx="4"/>
      <text x="12" y="17" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">员工工作周报（周期：2026/05/25 - 2026/05/29 · 部门：核心业务研发部）</text>

      <!-- Section 1 -->
      <rect x="0" y="32" width="428" height="22" fill="#1E293B" rx="3"/>
      <text x="8" y="47" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#94A3B8">一、上周工作完成情况</text>
      
      <!-- Row 1 Item -->
      <rect x="0" y="58" width="428" height="34" fill="#0B0F17" rx="3" stroke="#1E293B" stroke-width="1"/>
      <text x="8" y="74" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">1. 用户中心多租户权限系统重构</text>
      <rect x="366" y="65" width="52" height="18" rx="4" fill="#065F46"/>
      <text x="375" y="78" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#34D399">已完成</text>
      <text x="8" y="87" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">成果：完成接口幂等性改造，单据鉴权耗时降低 35%</text>

      <!-- Section 2 -->
      <rect x="0" y="98" width="428" height="22" fill="#1E293B" rx="3"/>
      <text x="8" y="113" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#94A3B8">二、本周重要工作项</text>

      <!-- Row 2 Item -->
      <rect x="0" y="124" width="428" height="34" fill="#0B0F17" rx="3" stroke="#1E293B" stroke-width="1"/>
      <text x="8" y="140" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">1. 高并发订单结算流水线性能优化</text>
      <rect x="378" y="131" width="40" height="18" rx="4" fill="#7C2D12"/>
      <text x="388" y="144" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#F87171">高</text>
      <text x="8" y="153" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">责任人：张三 · 协作人：李四</text>

      <!-- Section 4 (Saturation) -->
      <rect x="0" y="164" width="428" height="48" fill="#0F172A" rx="3" stroke="#334155" stroke-dasharray="3 3"/>
      <text x="8" y="182" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#38BDF8">四、工作饱和度评估与其他说明</text>
      <text x="8" y="200" font-family="-apple-system, sans-serif" font-size="10" fill="#CBD5E1">
        整体工作饱和度：<tspan fill="#34D399" font-weight="bold">饱和</tspan> · 负荷说明：多线任务并行推进，进度符合预期
      </text>
    </g>
  </g>
</svg>
