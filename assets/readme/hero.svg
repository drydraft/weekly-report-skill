<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">周报助手 — 多平台原生 Excel 周报 Agent Skill</title>
  <desc id="hero-desc">把一周口语工作碎碎念提炼为职场规范表述，经确认后安全写入原生 .xlsx 模板，兼容 Pi、Codex、DSH、Antigravity 与 Claude Code。</desc>

  <!-- Warm Paper Canvas (#F7F6F2) -->
  <rect width="1200" height="360" rx="22" fill="#F7F6F2"/>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#E5E1D8" stroke-width="1.5"/>

  <!-- Subtle Ledger Grid Lines on Right Half Only -->
  <g stroke="#EAE6DD" stroke-width="1" opacity="0.85">
    <line x1="650" y1="24" x2="650" y2="336"/>
    <line x1="810" y1="24" x2="810" y2="336"/>
    <line x1="970" y1="24" x2="970" y2="336"/>
    <line x1="1130" y1="24" x2="1130" y2="336"/>
    <line x1="630" y1="90" x2="1165" y2="90"/>
    <line x1="630" y1="180" x2="1165" y2="180"/>
    <line x1="630" y1="270" x2="1165" y2="270"/>
  </g>

  <!-- Left Editorial Narrative -->
  <g id="title-block" transform="translate(64, 58)">
    <text x="0" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#6B707B" letter-spacing="1.6">AGENT SKILL · WEEKLY REPORT</text>
    <rect x="0" y="28" width="36" height="4" rx="2" fill="#1B6B4A"/>

    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="56" font-weight="800" fill="#181A1F">周报助手</text>

    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#4A4F5A">把一周口语碎碎念，安全填进原生 <tspan fill="#1B6B4A" font-weight="700">.xlsx</tspan> 模板。</text>

    <line x1="0" y1="198" x2="500" y2="198" stroke="#E0DCD3" stroke-width="1.2"/>

    <text x="0" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="500" fill="#6B707B">Pi  ·  Codex  ·  DSH  ·  Antigravity  ·  Claude Code</text>
  </g>

  <!-- Right Native Visual Specimen: Clean Minimal Excel Sheet -->
  <g id="excel-specimen" transform="translate(668, 48)">
    <!-- Soft Paper Offset Shadow -->
    <rect x="8" y="8" width="466" height="264" rx="14" fill="#E8E4DA"/>
    <!-- Main Sheet Card -->
    <rect width="466" height="264" rx="14" fill="#FFFFFF" stroke="#E0DCD3" stroke-width="1.2"/>

    <!-- Minimal Sheet Header -->
    <rect x="20" y="18" width="10" height="10" rx="5" fill="#1B6B4A"/>
    <text x="40" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#6B707B">工作周报 - 张三 05-25至05-29.xlsx</text>
    <line x1="0" y1="48" x2="466" y2="48" stroke="#ECE8DF" stroke-width="1.2"/>

    <!-- Row R6 -->
    <g transform="translate(20, 64)">
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#9AA0AA">R6</text>
      <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#181A1F">多租户权限系统重构</text>
      <rect x="342" y="2" width="84" height="30" rx="7" fill="#EAF4EF"/>
      <text x="384" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#1B6B4A">已完成</text>
    </g>

    <line x1="20" y1="112" x2="446" y2="112" stroke="#F1EEE7" stroke-width="1.2"/>

    <!-- Row R14 -->
    <g transform="translate(20, 128)">
      <text x="0" y="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#9AA0AA">R14</text>
      <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="600" fill="#181A1F">结算流水线并发调优</text>
      <rect x="342" y="2" width="84" height="30" rx="7" fill="#FDF1EC"/>
      <text x="384" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#C95830">高优</text>
    </g>

    <line x1="20" y1="176" x2="446" y2="176" stroke="#F1EEE7" stroke-width="1.2"/>

    <!-- Row R29: Saturation & Formula Preservation -->
    <g transform="translate(20, 194)">
      <rect width="426" height="50" rx="10" fill="#F7F6F2"/>
      <rect x="12" y="10" width="66" height="30" rx="7" fill="#1B6B4A"/>
      <text x="45" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">饱和</text>
      <text x="94" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" font-weight="500" fill="#4A4F5A">保留原表样式与 <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1B6B4A" font-weight="600">=IF()</tspan> 公式</text>
    </g>
  </g>
</svg>
